# Build metadata for F-Droid (https://f-droid.org/docs/Build_Metadata_Reference/).
# Maintained here so F-Droid can pull build recipe updates directly from this
# repo instead of requiring a manual metadata PR to fdroiddata for every release.
#
# IMPORTANT: this app ships two build flavors (see app/build.gradle.kts):
#   - "full"   — includes Sentry crash reporting, distributed via GitHub releases.
#   - "fdroid" — no crash reporting, no network telemetry of any kind. This is
#                the flavor F-Droid must build (see Builds.gradle below), so the
#                F-Droid release carries no Anti-Features: Tracking disclosure.

Categories:
  - Multimedia
License: GPL-3.0-only
SourceCode: https://github.com/yaturner/tcamViewer2
IssueTracker: https://github.com/yaturner/tcamViewer2/issues

RepoType: git
Repo: https://github.com/yaturner/tcamViewer2.git

# versionName/versionCode are commit-count-derived (see app/build.gradle.kts) with no git tag
# per release, so "Tags" can't track new versions — F-Droid would be stuck serving whatever the
# last tagged release was forever. RepoManifest instead reads the version straight from the
# manifest at the tip of the tracked branch, matching this repo's actual versioning scheme.
AutoUpdateMode: Version
UpdateCheckMode: RepoManifest/app

CurrentVersion: '1.0'
CurrentVersionCode: 1

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    gradle:
      - fdroid
  # TODO: once this is committed, add a second entry here pinned to that commit's hash, with
  # its actual versionName/versionCode (bootstraps F-Droid onto current code instead of the
  # year-old v1.0 tag; RepoManifest then keeps picking up future versions automatically).
